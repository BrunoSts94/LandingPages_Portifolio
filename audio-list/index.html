<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>AudioList clair Obscure</title>
</head>
<body class="flex justify-center items-center min-h-screen bg-linear-to-t from-[#330B0B] to-[#CB261F]">
    <div class="flex flex-col items-center">
        <img 
        class="w-xs rounded-md mb-[16px]"
        id="capa" src="./imagens/capa.jpg" alt="imagem do dom casmurro">
        <audio 
        src="./audios/1.mp3" 
        id="audio-capitulo">
        </audio>
        
        <div class="text-center text text-white">
            <h1 id="capitulo" class="text-xl font-semibold">Faixa 1</h1>
            <p id="musica" class="text-base font-light text-stone-200">Clair Obscure Expedition 33</p>
        </div>

        <div class="flex w-full gap-[20px] justify-center text-white">
            <svg
            id="anterior"
            onclick="anteriorAudio()"
            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
            class="w-[50px] cursor-pointer hover:text-stone-500">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 16.811c0 .864-.933 1.406-1.683.977l-7.108-4.061a1.125 1.125 0 0 1 0-1.954l7.108-4.061A1.125 1.125 0 0 1 21 8.689v8.122ZM11.25 16.811c0 .864-.933 1.406-1.683.977l-7.108-4.061a1.125 1.125 0 0 1 0-1.954l7.108-4.061a1.125 1.125 0 0 1 1.683.977v8.122Z" />
            </svg>
           <svg 
           class="cursor-pointer w-[60px] hover:text-stone-500"
           id="btnPlayPause"
           onclick="playPause()"
           xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5V18M15 7.5V18M3 16.811V8.69c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061A1.125 1.125 0 0 1 3 16.811Z" />
            </svg>
            <svg
            id="proximo"
            onclick="proximoAudio()"
            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
            class="w-[50px] cursor-pointer hover:text-stone-500">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8.689c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061A1.125 1.125 0 0 1 3 16.811V8.69ZM12.75 8.689c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061a1.125 1.125 0 0 1-1.683-.977V8.69Z" />
            </svg>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
